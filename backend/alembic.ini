[alembic]
# Alembic configuration
# NOTE: Do NOT hardcode plaintext database credentials here. Prefer supplying
# the database connection string via the environment variable DATABASE_URL or
# by passing -x db_url="<your url>" to the alembic command. The project's
# alembic env.py should consult the environment first and fall back to this
# value only for local development when explicitly edited.

# Path to migration scripts (adjust if you place migrations elsewhere)
script_location = migrations

# Use an environment-provided URL. Many projects use an env-aware env.py that
# reads os.environ['DATABASE_URL'] when this value is a placeholder. Keep this
# intentionally as a named placeholder — do not hardcode production credentials.
sqlalchemy.url = %(DATABASE_URL)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s %(name)s:%(lineno)d - %(message)s
datefmt = %Y-%m-%d %H:%M:%S
